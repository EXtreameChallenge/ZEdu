[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --cov=backend --cov-report=term-missing --cov-report=xml
markers =
    slow: 耗时用例（真冷启 chromadb 等），默认仍跑，只是可 -m "not slow" 跳过

[coverage:run]
source = backend
omit =
    */test*
    */tests/*
    */migrations/*
    */alembic/*
    */__init__.py
